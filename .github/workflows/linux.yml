name: linux

on: workflow_dispatch

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up OpenCL
      run: |
        sudo apt-get -y install ocl-icd-opencl-dev
        sudo apt-get -y install opencl-headers

    - name: Pin Rust toolchain
      run: rustup toolchain install 1.97.1 --profile minimal

    - name: Build
      run: cargo +1.97.1 build --release

    - name: Create release
      uses: ncipollo/release-action@v1
      with:
        allowUpdates: true
        tag: dev-linux
        artifacts: "target/release/bacon"
        prerelease: true